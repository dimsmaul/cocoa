name: Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          swift --version

      - name: Build and Package Cocoa.app
        run: |
          chmod +x ./build-app.sh
          ./build-app.sh

      - name: Create DMG
        run: |
          mkdir -p dmg_root
          cp -R Cocoa.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Cocoa" -srcfolder dmg_root -ov -format UDZO Cocoa.dmg
          rm -rf dmg_root

      - name: Create Release and Upload DMG
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Cocoa.dmg
          generate_release_notes: true
